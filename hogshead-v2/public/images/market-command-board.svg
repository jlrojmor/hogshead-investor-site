<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="56%">
      <stop offset="0%" stop-color="#0E6A76" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#062B36" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#030B13"/>
    </radialGradient>
    <radialGradient id="globe" cx="47%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DDF7F5" stop-opacity="0.74"/>
      <stop offset="30%" stop-color="#73CBD2" stop-opacity="0.42"/>
      <stop offset="72%" stop-color="#0C5865" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D88B42" stop-opacity="0"/>
      <stop offset="48%" stop-color="#D88B42" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7BC6C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>
    <filter id="blurGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#B7F3F1" fill-opacity="0.34"/>
    </pattern>
  </defs>

  <rect width="2400" height="1350" rx="70" fill="#041018"/>
  <rect width="2400" height="1350" rx="70" fill="url(#bgGlow)"/>
  <rect width="2400" height="1350" rx="70" fill="url(#grid)"/>
  <path d="M0 210 C360 90 710 135 1120 210 C1590 295 1970 230 2400 82 V0 H0 V210Z" fill="#78E1E2" opacity="0.045"/>
  <circle cx="1260" cy="660" r="510" fill="#15C7D0" opacity="0.13" filter="url(#blurGlow)"/>
  <circle cx="860" cy="820" r="250" fill="#D88B42" opacity="0.16" filter="url(#blurGlow)"/>

  <!-- satellite panels -->
  <g filter="url(#softShadow)">
    <rect x="150" y="155" width="465" height="245" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="178" y="183" width="150" height="86" rx="16" fill="#FFFFFF" fill-opacity="0.055"/>
    <path d="M195 325 H570" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <path d="M205 360 C255 335 288 354 340 304 C410 238 470 286 560 220" stroke="#D88B42" stroke-width="5" fill="none"/>
    <text x="180" y="135" fill="#7BC6C7" font-family="Inter,Arial" font-size="20" font-weight="800" letter-spacing="6">MARKET GROWTH</text>
    <text x="190" y="238" fill="#FFFFFF" font-family="Inter,Arial" font-size="42" font-weight="900">$11.5B → $19.8B</text>
    <text x="190" y="293" fill="#FFFFFF" opacity="0.58" font-family="Inter,Arial" font-size="21" font-weight="700">Projected global tequila value</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1785" y="150" width="455" height="252" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="1817" y="135" fill="#7BC6C7" font-family="Inter,Arial" font-size="20" font-weight="800" letter-spacing="6">PREMIUMIZATION</text>
    <text x="1820" y="235" fill="#FFFFFF" font-family="Inter,Arial" font-size="42" font-weight="900">$3.12B → $5.18B</text>
    <text x="1820" y="290" fill="#FFFFFF" opacity="0.58" font-family="Inter,Arial" font-size="21" font-weight="700">Premium tequila segment</text>
    <g transform="translate(2050 250)">
      <circle r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="22"/>
      <path d="M0 -62 A62 62 0 0 1 55 29" stroke="#D88B42" stroke-width="22" stroke-linecap="round"/>
      <path d="M55 29 A62 62 0 0 1 -38 49" stroke="#7BC6C7" stroke-width="22" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="150" y="905" width="465" height="260" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="180" y="885" fill="#7BC6C7" font-family="Inter,Arial" font-size="20" font-weight="800" letter-spacing="6">U.S. DEMAND</text>
    <text x="190" y="982" fill="#FFFFFF" font-family="Inter,Arial" font-size="42" font-weight="900">$20.43B</text>
    <text x="190" y="1038" fill="#FFFFFF" opacity="0.58" font-family="Inter,Arial" font-size="21" font-weight="700">At-home + out-of-home estimate</text>
    <g transform="translate(192 1080)">
      <rect x="0" y="48" width="38" height="66" rx="8" fill="#D88B42"/>
      <rect x="56" y="25" width="38" height="89" rx="8" fill="#F1A34E"/>
      <rect x="112" y="38" width="38" height="76" rx="8" fill="#D88B42" opacity="0.75"/>
      <rect x="168" y="0" width="38" height="114" rx="8" fill="#F1A34E"/>
      <rect x="224" y="-25" width="38" height="139" rx="8" fill="#D88B42"/>
      <rect x="280" y="-43" width="38" height="157" rx="8" fill="#F1A34E"/>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1785" y="915" width="455" height="255" rx="28" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="1815" y="895" fill="#7BC6C7" font-family="Inter,Arial" font-size="20" font-weight="800" letter-spacing="6">CATEGORY RESILIENCE</text>
    <text x="1820" y="992" fill="#FFFFFF" font-family="Inter,Arial" font-size="50" font-weight="900">+2.9%</text>
    <text x="1820" y="1048" fill="#FFFFFF" opacity="0.58" font-family="Inter,Arial" font-size="21" font-weight="700">Reported Tequila/Mezcal growth</text>
    <path d="M1825 1115 C1880 1080 1932 1132 1992 1072 C2055 1010 2125 1056 2190 992" stroke="#D88B42" stroke-width="6" fill="none"/>
  </g>

  <!-- central globe -->
  <g transform="translate(1200 685)">
    <circle r="420" fill="url(#globe)" stroke="#DDF7F5" stroke-opacity="0.24" stroke-width="2"/>
    <circle r="420" fill="url(#dots)" opacity="0.48"/>
    <circle r="535" fill="none" stroke="#7BC6C7" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="610" fill="none" stroke="#7BC6C7" stroke-opacity="0.06" stroke-width="2"/>
    <g stroke="#DDF7F5" stroke-opacity="0.18" fill="none" stroke-width="1.5">
      <ellipse rx="420" ry="122"/>
      <ellipse rx="420" ry="248"/>
      <ellipse rx="162" ry="420"/>
      <ellipse rx="282" ry="420"/>
      <path d="M-420 0 H420"/>
      <path d="M0 -420 V420"/>
    </g>
    <g fill="#DDF7F5" opacity="0.28" stroke="#DDF7F5" stroke-opacity="0.18" stroke-width="1">
      <path d="M-288 -185 C-232 -270 -112 -276 -36 -212 C10 -173 2 -115 -62 -88 C-152 -50 -252 -70 -288 -185Z"/>
      <path d="M-140 -20 C-52 -48 40 12 60 112 C82 220 0 294 -88 248 C-160 210 -196 42 -140 -20Z"/>
      <path d="M62 -195 C160 -284 318 -248 366 -154 C410 -66 314 12 172 -20 C82 -40 46 -112 62 -195Z"/>
      <path d="M256 74 C340 32 450 96 462 196 C474 286 372 334 296 266 C232 210 204 104 256 74Z"/>
      <path d="M-355 90 C-290 42 -214 82 -196 158 C-180 226 -246 286 -320 244 C-380 208 -412 136 -355 90Z"/>
    </g>
    <g fill="none" stroke="url(#flow)" stroke-width="5" filter="url(#blurGlow)">
      <path d="M-260 118 C-150 -88 8 -160 202 -210"/>
      <path d="M-260 118 C-30 154 168 132 332 52"/>
      <path d="M-260 118 C-330 172 -365 242 -400 328"/>
    </g>
    <g>
      <circle cx="-260" cy="118" r="18" fill="#D88B42"/>
      <circle cx="-260" cy="118" r="52" fill="#D88B42" opacity="0.18"/>
      <circle cx="-178" cy="-52" r="16" fill="#7BC6C7"/>
      <circle cx="238" cy="-128" r="16" fill="#D88B42"/>
      <circle cx="336" cy="68" r="16" fill="#D88B42"/>
    </g>
  </g>

  <!-- bottom ticker -->
  <rect x="700" y="1210" width="1000" height="82" rx="41" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <text x="760" y="1260" fill="#7BC6C7" font-family="Inter,Arial" font-size="18" font-weight="800" letter-spacing="5">ORIGIN</text>
  <text x="930" y="1260" fill="#FFFFFF" fill-opacity="0.72" font-family="Inter,Arial" font-size="20" font-weight="800">Mexico</text>
  <text x="1090" y="1260" fill="#D88B42" font-family="Inter,Arial" font-size="28" font-weight="900">→</text>
  <text x="1180" y="1260" fill="#7BC6C7" font-family="Inter,Arial" font-size="18" font-weight="800" letter-spacing="5">DEMAND</text>
  <text x="1370" y="1260" fill="#FFFFFF" fill-opacity="0.72" font-family="Inter,Arial" font-size="20" font-weight="800">U.S. / North America / Premium Segment</text>
</svg>