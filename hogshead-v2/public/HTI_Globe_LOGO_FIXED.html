  <style>
    :root{--bg:#050a12;--gold:#E8A838;--gold2:#f7c66b;--aqua:#76d4d6;--card:rgba(13,24,41,.78);--text:#fff;--muted:#8ba3be;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--glass:blur(22px) saturate(130%)}

    #app{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate} #globeCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;z-index:2}.grain{pointer-events:none;position:absolute;inset:0;z-index:8;opacity:.11;mix-blend-mode:soft-light;background-image:repeating-radial-gradient(circle at 17% 25%,rgba(255,255,255,.2),transparent .8px,transparent 2px),repeating-linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.06) 1px,transparent 1px,transparent 4px)}.vignette{pointer-events:none;position:absolute;inset:0;z-index:7;background:radial-gradient(circle at center,transparent 33%,rgba(0,0,0,.42) 76%,rgba(0,0,0,.82) 100%),linear-gradient(90deg,rgba(5,10,18,.92),transparent 30%,transparent 70%,rgba(5,10,18,.78))}
    .topbar{position:fixed;top:22px;left:26px;right:26px;z-index:30;display:grid;grid-template-columns:260px 1fr 260px;align-items:center;gap:18px;pointer-events:none}.brand{pointer-events:auto;display:inline-flex;align-items:center;gap:13px;width:fit-content;border-radius:999px;padding:10px 14px 10px 10px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));box-shadow:0 20px 70px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:var(--glass)}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95),rgba(255,255,255,.6) 38%,rgba(255,255,255,.14)),linear-gradient(135deg,rgba(232,168,56,.75),rgba(118,212,214,.35));color:#06121f;font-family:var(--serif);font-weight:700;letter-spacing:-.05em;box-shadow:0 0 0 1px rgba(255,255,255,.55),0 0 38px rgba(232,168,56,.22)}.brand-text{display:flex;flex-direction:column;line-height:1}.brand-text strong{font-size:14px;letter-spacing:.14em;text-transform:uppercase}.brand-text span{margin-top:4px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:900}.headline{justify-self:center;text-align:center;pointer-events:none}.headline .eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.28em;font-size:11px;font-weight:900;opacity:.9}.headline h1{margin:3px 0 0;font-family:var(--serif);font-size:clamp(24px,3.2vw,47px);line-height:.96;letter-spacing:-.04em;text-shadow:0 10px 40px rgba(0,0,0,.48)}.top-actions{justify-self:end;display:inline-flex;gap:10px;pointer-events:auto}.pill-btn{border:0;border-radius:999px;padding:13px 18px;background:rgba(255,255,255,.10);color:white;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.24);backdrop-filter:var(--glass);cursor:pointer;transition:.25s}.pill-btn:hover{transform:translateY(-2px);background:rgba(232,168,56,   </style>
